# Forward the analysis API next to the gOS build. gOS calls "<its own URL>sc-api/",
# so if gOS is served at https://host/gos/ the API must answer at /gos/sc-api/.
# Requires mod_proxy and mod_proxy_http.

ProxyPass        "/gos/sc-api/" "http://127.0.0.1:8787/"
ProxyPassReverse "/gos/sc-api/" "http://127.0.0.1:8787/"

# Jobs can take a while to queue; the API itself answers quickly, so a
# modest timeout is enough.
ProxyTimeout 120
